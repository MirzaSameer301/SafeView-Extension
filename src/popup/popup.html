<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SafeEyes</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <span class="logo" aria-hidden="true">🛡️</span>
        <h1>SafeEyes</h1>
      </header>
      <section id="view-register" class="view" hidden>
        <h2>Create your account</h2>
        <p class="muted">
          Choose a name and a password. You will need the password to change any
          setting.
        </p>
        <form id="register-form" novalidate>
          <label class="field">
            <span>Name</span>
            <input id="register-name" type="text" autocomplete="username" />
          </label>
          <label class="field">
            <span>Password</span>
            <input
              id="register-password"
              type="password"
              autocomplete="new-password"
            />
          </label>
          <p id="register-error" class="error" role="alert"></p>
          <button type="submit" class="btn btn-primary">Create account</button>
        </form>
      </section>

      <section id="view-login" class="view" hidden>
        <h2>Welcome back, <span id="login-name"></span></h2>
        <p class="muted">Enter your password to manage your settings.</p>
        <form id="login-form" novalidate>
          <label class="field">
            <span>Password</span>
            <input
              id="login-password"
              type="password"
              autocomplete="current-password"
            />
          </label>
          <p id="login-error" class="error" role="alert"></p>
          <button type="submit" class="btn btn-primary">Unlock</button>
        </form>
      </section>
    </main>

    <script src="../shared/categories.js"></script>
    <script src="../shared/storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
